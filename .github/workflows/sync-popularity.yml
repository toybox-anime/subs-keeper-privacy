name: Sync popularity from telemetry

# 匿名統計の集計(GASのdoGet)を毎日取りに行き、prices.json の popularity を更新する。
# リポジトリ変数 POPULARITY_URL が未設定なら何もしない。
on:
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.POPULARITY_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts and update prices.json
        env:
          POPULARITY_URL: ${{ vars.POPULARITY_URL }}
        run: python3 tools/sync_popularity.py

      - name: Commit if changed
        run: |
          if git diff --quiet prices.json; then
            echo "変更なし"; exit 0
          fi
          git config user.name "popularity-bot"
          git config user.email "noreply@github.com"
          git add prices.json
          git commit -m "人気順を匿名統計から更新"
          git push
